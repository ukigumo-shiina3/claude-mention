name: Claude Code
on:
  pull_request:
    types: [opened, labeled]

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@f4d737af0b61a79741d8246c5207da5887746212 # v1.0.15
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request with a focus on:
              ## Notes
              - All responses must be written in Japanese.
              - If the implementation is unaffected, omit unnecessary details about non-breaking changes and keep the report concise.
              - Refer to all possible primary sources (e.g., code, commit history, changelog).
              - Always attach the original URL for every citation or reference.
              - Do not perform commits or merges.
              - At the end, always post a summary comment on the PR, following the format shown in the link below:
                - https://github.com/PlexJP/plexjob-api/pull/3089#issuecomment-2942586166

              ## Handling Breaking Changes
              - When a breaking change is detected:
              - Provide concrete examples of how it affects existing implementation patterns (include actual code examples if possible).
              - Suggest specific code modifications to maintain compatibility.
              - Assess the overall impact on the project.
              - However, if the issue can be resolved solely through a library version upgrade, no code fix suggestion is required.

              ## Presentation of Review Results
              - All results must be provided in a single consolidated comment.
              - Clearly state the conclusion first (e.g., Approved or Changes Required).
              - Include direct links to all documents and sources used for investigation.
              - Present code examples in Markdown format, with line-number references if applicable.
              - Base your analysis strictly on facts and focus on critical issues.

              ## Investigation Summary
                - At the end, summarize the findings using the following structure:
                - Conclusion
                - Details of vulnerabilities
                - Assessment of package update appropriateness
                - Impact on the project
                - Investigation methodology
                - Reference links
              - All findings should be posted as a comment on the pull request.
            Provide detailed feedback using inline comments for specific issues.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

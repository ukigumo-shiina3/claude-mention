name: Claude Code
on:
  pull_request:
    types: [opened, labeled]

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@f4d737af0b61a79741d8246c5207da5887746212 # v1.0.15
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Must answer in Japanese.
            Please review this pull request with a focus on:
            ## 対象PR

            {{ pr_url }}

            ## 注意事項

            - 回答はすべて日本語で行う
            - 実際の実装に影響がなければ破壊的変更への対応が不要な分、レポートは簡潔に表現する
            - あらゆる一次情報源（コード、コミット履歴、変更履歴等）を参照する
            - 全ての引用・参照には必ず元のURLを添付する
            - コミットとマージは行わない
            - 最後に「対象PR」のコメントとして、以下のリンクのようにまとめてコメントを必ず行う
                - https://github.com/PlexJP/plexjob-api/pull/3089#issuecomment-2942586166

            ## 依頼内容

            - 「対象PR」の依存関係更新に問題がないかの確認を行う
            - 「対象PR」のタイトルからでなく、ファイルの更新内容を元に調査を行う
            - 現在のバージョンと更新後のバージョン間の破壊的変更(breaking changes)を確認する
            - CIが失敗している場合は、CIを直すためにローカルで検証し、コミットは行わず修正案の提出だけをする
            - バージョン更新後にmake testを実行してRSpecのテストが問題ないかの確認を行う

            ## 破壊的変更への対応破壊的変更が見つかった場合：

            - 具体的な実装パターンへの影響例（ある場合は実際のコード例）
            - 互換性維持のための具体的なコード修正案
            - プロジェクト全体への影響度合い
            - ただし、ライブラリのバージョンアップデートだけで問題が解決する場合は修正案不要

            ## レビュー結果の提示**必ず単一のコメントにまとめて提供してください**：

            - 結論を最初に明示（承認または修正必要）
            - 調査に使用した全てのドキュメント・ソースへの直接リンク
            - コード例はマークダウン形式で、行番号参照付きで
            - 分析は事実に基づき、重要な問題に集中

            ## 調査結果 :

            - 下記の観点で最後にまとめる
                - 結論
                - 脆弱性の詳細
                - パッケージ更新の適切性評価
                - プロジェクトへの影響
                - 調査方法
                - 参考リンク
            - 調査結果は「対象のPR」コメントする

            Provide detailed feedback using inline comments for specific issues.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
